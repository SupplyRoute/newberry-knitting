<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="뉴베리니팅의 미국 수제 울 장갑 컬렉션을 만나보세요.">
  <meta name="theme-color" content="#f7f5f0">
  <meta property="og:title" content="제품 | 뉴베리니팅">
  <meta property="og:description" content="오래 따뜻하도록 손으로 완성한 뉴베리니팅 장갑입니다.">
  <meta property="og:image" content="https://supplyroute.co.kr/web/product/medium/202512/1c15ba1bdde797e21bec59ce6091b155.jpg">
  <title>제품 | 뉴베리니팅</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="products-page-body">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="뉴베리니팅 홈">
        <img src="assets/newberry-logo.png" alt="뉴베리니팅" width="250" height="112">
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span><span class="sr-only">메뉴 열기</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
        <a href="index.html#home">홈</a>
        <a href="about.html">내 소개</a>
        <a class="active" href="products.html" aria-current="page">제품</a>
        <a href="story/">이야기</a>
        <a href="index.html#contact">연락하기</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="products-page-hero">
      <p class="eyebrow reveal">NEWBERRY COLLECTION</p>
      <h1 class="reveal">손으로 완성한<br><em>이번 겨울의 장갑</em></h1>
      <p class="reveal">뉴욕에서 이어온 뜨개 방식과 포근한 울, 매일 손이 가는 편안한 디자인을 한곳에 모았습니다.</p>
    </section>

    <section class="section products products-catalog" aria-labelledby="products-title">
      <div class="section-title-row reveal">
        <div>
          <p class="eyebrow">ALL PRODUCTS</p>
          <h2 id="products-title">전체 제품</h2>
        </div>
        <p class="catalog-count" data-product-count aria-live="polite"></p>
      </div>
      <div class="product-grid" data-products-grid></div>
      <p class="products-status" data-products-status role="status" aria-live="polite">제품을 불러오는 중입니다.</p>
      <p class="stock-note reveal"><span aria-hidden="true">※</span> 재고와 판매 상태는 스토어에서 실시간으로 달라질 수 있습니다.</p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand footer-brand" href="index.html"><img src="assets/newberry-logo.png" alt="뉴베리니팅" width="250" height="112"></a>
    <p>미국의 손끝에서, 당신의 겨울로.</p>
    <p class="copyright">© <span id="year"></span> NEWBERRY KNITTING</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
